<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivio RH di Alpöge: il build dal vivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap">
<style>
/* una sola figura a tutto schermo; il resto sono scritte leggere sopra e una scheda che si aggancia a destra */
:root{color-scheme:dark;--bg:#060911;--panel:#0c1120;--well:#080c18;--line:#28314f;--line2:#3a4568;--fg:#eef0f7;--fg2:#d5d9ea;--mu:#9aa4c4;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #aebfff;outline-offset:2px}
#stage{position:absolute;inset:0}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#web{opacity:.35}
#glow{filter:blur(6px);opacity:.55;mix-blend-mode:screen}
/* il cursore del tempo scorre sull'asse delle ore: la traccia è l'asse stesso */
#scrub{position:absolute;height:44px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize}
#scrub::-webkit-slider-runnable-track{height:44px;background:transparent}
#scrub::-moz-range-track{height:44px;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:15px;border-radius:50%;background:var(--fg2);border:4px solid var(--bg);transition:transform .15s}
#scrub:hover::-webkit-slider-thumb,#scrub:focus-visible::-webkit-slider-thumb{transform:scale(1.5);background:var(--fg)}
#scrub::-moz-range-thumb{width:6px;height:6px;border-radius:50%;background:var(--fg2);border:4px solid var(--bg)}
#scrub:focus-visible{outline:2px solid #aebfff;outline-offset:2px;border-radius:8px}
#head{position:absolute;left:0;top:0;padding:28px 32px 0 72px;display:flex;flex-direction:column;gap:10px;max-width:min(520px,100%);pointer-events:none}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
#pct{font:300 clamp(56px,9vw,112px)/.95 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#files{font:500 17px var(--serif);color:var(--fg2)}
#right{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
#ctl{display:flex;align-items:center;gap:2px;pointer-events:auto}
.ic{min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:transparent;border:none;border-radius:18px;color:var(--mu)}
.ic:hover{color:var(--fg);background:rgba(154,164,196,.12)}
.ic.txt{padding:0 10px;font-size:12px;font-variant-numeric:tabular-nums}
#bLive{color:var(--fg)}
#bLive i{width:6px;height:6px;border-radius:50%;background:#ff9c9c}
.sep{width:1px;height:16px;margin:0 6px;background:var(--line)}
.pill{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;background:rgba(20,27,48,.85);border:1px solid var(--line2);border-radius:22px;font-size:12px}
.pill.off{background:transparent;border-color:#1e2640;color:#7f8aad}
.pill.ghost{background:transparent;border-style:dashed;border-color:#5a6690}
.pill i{width:8px;height:8px;border-radius:50%;flex:none}
.pill small{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
#foot{position:absolute;left:0;right:0;bottom:0;padding:0 32px 14px 72px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mu);pointer-events:none}
#line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 28px}
#sum{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--fg2)}
#filters{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
#tip{position:absolute;max-width:340px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;pointer-events:none;overflow-wrap:anywhere}
#tip b{display:block;font:500 15px var(--serif)}
#tip span{color:var(--mu);font-size:12px}
#panel{position:absolute;right:16px;top:16px;bottom:138px;width:min(384px,calc(100% - 32px));display:flex;flex-direction:column;background:rgba(12,17,32,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#panel header{padding:14px 18px 12px;display:flex;flex-direction:column;gap:6px}
#panel header .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
#panel h2{margin:0;font:500 21px/1.15 var(--serif);overflow-wrap:anywhere}
#panel .path{color:var(--mu);font-size:12px;overflow-wrap:anywhere}
.x{width:44px;height:44px;margin:-8px -12px -8px 0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--mu);border:none;border-radius:22px}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;padding:0 10px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mu)}
.tabs button[aria-selected=true]{color:var(--fg)}
.body{flex:1;min-height:0;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere}
/* la barra di scorrimento della scheda segue la grafica: sottile, senza binario */
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:#5a6690;border:3px solid transparent;background-clip:padding-box}
dl.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 18px;margin:0}
dl.rows dt{color:var(--mu)}
dl.rows dd{margin:0;font-variant-numeric:tabular-nums}
.sub{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.note{color:var(--mu);font-size:12px}
.mono{font:11.5px/1.45 var(--mono)}
.thm{font:italic 400 15px var(--serif)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:44px;height:44px;background:transparent;border:1px solid var(--line2);border-radius:22px}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{flex:1;text-align:center;color:var(--mu);font-variant-numeric:tabular-nums}
.proof{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.proof .spine{position:absolute;left:4px;top:8px;bottom:22px;width:1px;background:var(--line2);transform-origin:top;animation:grow 1s ease-out both}
.prem{position:relative;display:flex;flex-direction:column;gap:2px;animation:in .5s ease-out both}
.prem i{position:absolute;left:-22px;top:5px;width:9px;height:9px;border:1.5px solid var(--mu)}
.prem b{font:italic 400 13px var(--serif)}
.prem span{color:#b9c2de}
.thesis{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--well);border:1px solid var(--mu);border-radius:10px;animation:thesis 1.5s ease-out both}
.thesis i{position:absolute;left:-24px;top:12px;width:13px;height:13px;border-radius:50%}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes thesis{0%{opacity:0;transform:translateY(-8px);box-shadow:0 0 0 0 rgba(255,255,255,0)}45%{opacity:1;transform:none;box-shadow:0 0 0 0 rgba(255,255,255,.4)}100%{opacity:1;box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#1a2238}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.list button{width:100%;min-height:44px;padding:4px 10px;display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;border-radius:10px;text-align:left}
.list button:hover{border-color:var(--line)}
.list button i{width:8px;height:8px;border-radius:50%;flex:none}
.list button b{flex:1;min-width:0;font-weight:400;overflow-wrap:anywhere}
.list button span{color:var(--mu);flex:none;font-variant-numeric:tabular-nums}
.area{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.area .bar{grid-column:1/3;height:4px}
.area span{color:var(--mu);font-variant-numeric:tabular-nums}
svg text{fill:var(--mu);font:11px var(--sans)}
[hidden]{display:none!important}
@media (max-width:760px){#head{padding:20px 16px 0 16px}#foot{padding:8px 16px 12px}#panel:not([hidden]) ~ #foot #filters{display:none}}
.body>svg{flex:none}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items a,.plain{color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.plain{text-decoration:underline}
.items a:hover{text-decoration:underline}
.items small{display:block;margin-top:2px;color:var(--mu);font-size:12px}
.tag{margin-left:6px;padding:1px 7px;border:1px solid var(--line2);border-radius:9px;font-size:11px;color:var(--mu);white-space:nowrap}
.tag.us{border-color:#5ed6b4;color:#5ed6b4}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
<canvas id="axes" aria-hidden="true"></canvas>
<canvas id="web" aria-hidden="true"></canvas>
<canvas id="glow" aria-hidden="true"></canvas>
<canvas id="art" role="img" aria-label="Tracciato del build: il tempo in orizzontale, il livello di dipendenza in verticale, un tratto per ogni file compilato e un filo verso ogni file che importa"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
</div>
<input type="range" id="scrub" min="0" max="1" step="1" value="1" aria-label="Scorri il tempo del build">
<div id="head">
<div class="eyebrow" id="eyebrow">Ricostruzione indipendente dell'archivio Lean di Alpöge, in corso</div>
<div id="pct">–</div>
<div id="files">Caricamento dei dati</div>
</div>
<aside id="panel" hidden></aside>
<div id="tip" hidden><b></b><span></span></div>
<div id="foot">
<div id="filters"></div>
<div id="line">
<div id="sum"><span id="sRate"></span><span id="sEnd"></span><span id="sErr"></span></div>
<div id="right">
<div id="clock">In collegamento con il pod</div>
<div id="ctl">
<button type="button" class="ic txt" id="bLive" hidden><i></i>Torna al presente</button>
<button type="button" class="ic" id="bPlay"></button>
<button type="button" class="ic txt" id="bSpeed" title="Velocità di riproduzione" aria-label="Velocità di riproduzione">×300</button>
<span class="sep" aria-hidden="true"></span>
<a class="ic txt" id="aArch" href="architettura.html" style="text-decoration:none"></a>
<button type="button" class="ic txt" id="bComm"></button>
<button type="button" class="ic txt" id="bChecks">Controlli</button>
<button type="button" class="ic txt" id="bLang"></button>
<button type="button" class="ic" id="bBuild" title="Stato del build" aria-label="Stato del build"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 13.5h11M4.5 11V7M8 11V4M11.5 11V8.5"></path></svg></button>
<button type="button" class="ic" id="bFull" title="Schermo intero" aria-label="Schermo intero"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"></path></svg></button>
</div>
</div>
</div>
</div>
<script>
(() => {
'use strict';
// lingua: ?lang= nell'indirizzo, poi la scelta salvata, poi quella del browser; italiano solo se chiesto
let EN = true;
{ let l = new URLSearchParams(location.search).get('lang'); if (!l) { try { l = localStorage.getItem('lang'); } catch (e) {} } EN = !/^it/i.test(l || navigator.language || 'en'); }
const T = (it, en) => (EN ? en : it), LOC = EN ? 'en-GB' : 'it-IT', DEC = EN ? '.' : ',';
document.documentElement.lang = EN ? 'en' : 'it';
const COL = [[246,180,98],[120,170,250],[94,214,180],[186,150,250],[248,134,176],[208,220,104],[248,128,112],[200,205,220]];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const rgb = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const hex = (c) => 'rgb(' + c.join(',') + ')';
const nf = (n) => Math.round(n).toLocaleString(LOC);
const dur = (s) => { s = Math.round(s); return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s' : Math.floor(s / 3600) + ' h ' + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ' min'; };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// dati statici del grafo e stato del build
let M, N, T0, LV, lvl, lib, doff, deps, uoff, users, S, E, FL, byLevel, cnt, names = null;
let order = [], nEv = 0, skew = 0, sys = null, run = [], runMap = new Map(), pops = [];
const on = new Array(8).fill(true);
// geometria
let W = 0, H = 0, dpr = 1, x0 = 0, x1f = 0, y0 = 0, y1 = 0, TD = 1800, dockT = 0, dockK = 0;
// disegno progressivo, selezione, scheda
let queue = [], qi = 0, hot = -1, sel = null, panel = null, info = null, decl = 0, firstLoad = true;
// base: indirizzo del pod (null = istantanea in data/); frozen: istante a cui il tempo della pagina è fermo (l'istantanea, oppure la fine del build); checks: risultati.json
let base = null, frozen = null, checks = null;
// ck: ultima misura del processo del controllore (ck.json); ckT: secondi dall'avvio del controllore a cui ha caricato ciascun modulo
let ck = null, ckT = [], nCk = 0;
// stmtOn: la sezione Enunciato si accende solo se live.json dice "enunciati": true (serve il permesso dell'autore dell'archivio)
let stmtOn = false;
const tab = { build: 'checks', file: 'time', comm: 'over' };
// scorrimento nel tempo: view è l'istante che si sta guardando (null = presente); drawnFor dice fin dove è disegnata la trama
let view = null, drawnFor = Infinity, playing = false, speed = 300, maxDur = 0, lastFrame = 0, idleAt = 0;
const cv = {}, cx = {};
for (const id of ['axes', 'web', 'glow', 'art', 'fx']) { cv[id] = $(id); cx[id] = cv[id].getContext('2d'); }

const now = () => (frozen != null ? frozen : Date.now() / 1000 + skew - T0);
const clock = (sec) => new Date((T0 + sec - skew) * 1000).toLocaleTimeString(LOC);
const short = (i) => (names ? names[i].split('.').pop() : T('file n. ', 'file no. ') + i);
const isDone = (i) => E[i] === E[i];
const st = (i) => (S[i] === S[i] ? S[i] : runMap.has(i) ? runMap.get(i).s : now());
const en = (i) => (isDone(i) ? E[i] : now());
const tau = () => (view == null ? now() : view);
const enV = (i) => Math.min(en(i), tau());
// order è tenuto in ordine di fine: quanti file erano finiti all'istante t
function kAt(t) { let lo = 0, hi = order.length; while (lo < hi) { const m = (lo + hi) >> 1; if (E[order[m]] <= t) lo = m + 1; else hi = m; } return lo; }
// i file che all'istante t erano in compilazione: partiti, non ancora finiti
function runningAt(t) {
  const out = [];
  for (let j = kAt(t); j < order.length && E[order[j]] - t <= maxDur; j++) if (S[order[j]] <= t) out.push({ i: order[j], s: S[order[j]] });
  for (const r of run) if (!isDone(r.i) && r.s <= t) out.push(r);
  return out;
}
function playIcon() {
  const b = $('bPlay'), label = playing ? T('Pausa', 'Pause') : view == null ? T('Rivedi il build dall\'inizio', 'Replay the build from the start') : T('Riprendi da qui', 'Resume from here');
  b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = playing
    ? '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3.5" width="2.8" height="9" rx="1"></rect><rect x="9.2" y="3.5" width="2.8" height="9" rx="1"></rect></svg>'
    : '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5z"></path></svg>';
}
function setView(t) {
  const tn = now();
  view = t == null || t >= tn - 2 ? null : Math.max(0, t);
  if (view == null) playing = false;
  if (view == null ? drawnFor !== Infinity : drawnFor !== Infinity && view > drawnFor) redraw(Infinity);
  idleAt = performance.now();
  $('bLive').hidden = view == null;
  playIcon();
  hud();
}

// pause: intervalli di almeno 20 minuti in cui nessun file era in compilazione, cioè la macchina era spenta.
// busy segna i minuti in cui almeno un file era in corso; PZ sono le pause, in secondi dall'avvio.
let PZ = [], busy = new Uint8Array(4096);
const ct = (sec) => { let c = sec; for (const [a, b] of PZ) { if (sec >= b) c -= b - a; else if (sec > a) c -= sec - a; } return c; };
const ut = (c) => { for (const [a, b] of PZ) { if (c > a) c += b - a; else break; } return c; };
function pauses() {
  const out = []; let last = -1;
  for (let m = 0; m < busy.length; m++) if (busy[m]) { if (last >= 0 && m - last - 1 >= 20) out.push([(last + 1) * 60, m * 60]); last = m; }
  if (JSON.stringify(out) === JSON.stringify(PZ)) return;
  PZ = out; redraw();
}
// due sole scale, entrambe lineari: secondi di build (senza le pause) in orizzontale, livello di dipendenza in verticale
const X = (sec) => x0 + (ct(sec) / TD) * (x1f - x0);
const Y = (level) => y0 - (level / (LV - 1)) * (y0 - y1);
const sidePx = () => (panel && innerWidth >= 900 ? 400 : 0);
const dockScale = () => 1 - (dockK * sidePx() * dpr) / (x1f - x0);
const Xd = (sec) => x0 + (X(sec) - x0) * dockScale();
function curve(c, ax, ay, bx, by) { const m = Math.max(0, bx - ax) * 0.5; c.moveTo(ax, ay); c.bezierCurveTo(ax + m, ay, bx - m, by, bx, by); }
function along(ax, ay, bx, by, t) { const m = Math.max(0, bx - ax) * 0.5, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, e = t * t * t; return [a * ax + b * (ax + m) + c * (bx - m) + e * bx, a * ay + b * ay + c * by + e * by]; }

function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  for (const id in cv) { const g = id === 'glow' ? 0.5 : 1; cv[id].width = Math.max(2, Math.round(W * g)); cv[id].height = Math.max(2, Math.round(H * g)); }
  x0 = 72 * dpr; x1f = W - 40 * dpr; y0 = H - 166 * dpr; y1 = 40 * dpr;
  if (innerWidth < 760) { x0 = 40 * dpr; x1f = W - 16 * dpr; }
  for (const id of ['web', 'glow', 'art']) cv[id].style.transformOrigin = x0 / dpr + 'px 0';
  redraw();
}
function redraw(at = drawnFor) {
  if (!N) return;
  drawnFor = at;
  for (const id of ['web', 'glow', 'art']) { cx[id].setTransform(1, 0, 0, 1, 0, 0); cx[id].clearRect(0, 0, cv[id].width, cv[id].height); cx[id].lineCap = 'round'; }
  cx.glow.setTransform(0.5, 0, 0, 0.5, 0, 0);
  cx.web.lineWidth = 0.7 * dpr; cx.art.lineWidth = 1.7 * dpr; cx.glow.lineWidth = 2.4 * dpr;
  if (at === Infinity) queue = order.slice();
  else { queue = order.slice(0, kAt(at)); for (const r of runningAt(at)) if (isDone(r.i)) queue.push(r.i); }
  qi = 0;
  axes();
}
// i file si disegnano a piccoli gruppi per fotogramma, così la pagina resta fluida anche con centinaia di migliaia di fili
function pump() {
  if (qi >= queue.length) { if (queue.length) { queue = []; qi = 0; } return; }
  const t = performance.now();
  while (qi < queue.length && performance.now() - t < 9) {
    const end = Math.min(queue.length, qi + 500), by = [[], [], [], [], [], [], [], []];
    for (; qi < end; qi++) { const i = queue[qi]; if (on[lib[i]]) by[lib[i]].push(i); }
    for (let k = 0; k < 8; k++) {
      const a = by[k];
      if (!a.length) continue;
      cx.art.strokeStyle = cx.glow.strokeStyle = rgb(COL[k], 0.6);
      cx.web.strokeStyle = rgb(COL[k], 0.07);
      cx.art.beginPath(); cx.glow.beginPath(); cx.web.beginPath();
      for (const i of a) {
        const y = Y(lvl[i]), xa = X(S[i]), xb = Math.max(xa + dpr, X(E[i]));
        cx.art.moveTo(xa, y); cx.art.lineTo(xb, y);
        cx.glow.moveTo(xa, y); cx.glow.lineTo(xb, y);
        for (let j = doff[i]; j < doff[i + 1]; j++) { const g = deps[j]; if (isDone(g)) curve(cx.web, X(E[g]), Y(lvl[g]), xa, y); }
      }
      cx.art.stroke(); cx.glow.stroke(); cx.web.stroke();
    }
  }

// anche i "per ogni" e le implicazioni in testa alla tesi sono premesse
function parse(text) {

      for (; j < n; j++) { if (all.includes(str[j])) dp++; else if (allc.includes(str[j])) { dp--; if (dp === 0) break; } }

      for (let q = 0; q < inner.length; q++) { const ch = inner[q]; if (all.includes(ch)) d2++; else if (allc.includes(ch)) d2--; else if (ch === ':' && d2 === 0 && inner[q + 1] !== '=') { c = q; break; } }

      i = j + 1; skip();
    }

  };

      hyps.push({ b: '∀', names: '', type: r2.slice(0, c).trim() });

    rest = rest.slice(a + 1).trim();

  }
  lvl = new Uint8Array(a[1]); lib = new Uint8Array(a[2]); doff = new Uint32Array(a[3]); deps = new Uint32Array(a[4]);
  // elenco inverso: chi usa ciascun file
  uoff = new Uint32Array(N + 1);
  for (let j = 0; j < deps.length; j++) uoff[deps[j] + 1]++;
  for (let i = 0; i < N; i++) uoff[i + 1] += uoff[i];
  users = new Uint32Array(deps.length); const pos = uoff.slice(0, N);
  for (let i = 0; i < N; i++) for (let j = doff[i]; j < doff[i + 1]; j++) users[pos[deps[j]]++] = i;
  S = new Float32Array(N).fill(NaN); E = new Float32Array(N).fill(NaN); FL = new Uint8Array(N);
  byLevel = Array.from({ length: LV }, () => []); cnt = new Array(8).fill(0);
  buildFilters(); resize();
  addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
  if (base != null) {
    const ev = guard(pollEvents, T('eventi', 'events')), nw = guard(pollNow, T('file in compilazione', 'files compiling')), sy = guard(pollSys, T('stato', 'status'));
    await ev(); nw();
    setInterval(ev, 8000); setInterval(nw, 3000); setInterval(sy, 10000);
    const cw = () => { if (sys && sys.exit !== '') pollChecker().catch(() => {}); };
    cw(); setInterval(cw, 10000);
  } else {
    await pollEvents(); await pollNow();
    if (sys.exit !== '') pollChecker().catch(() => {});
    $('clock').textContent = (sys.exit !== '' ? T('Build concluso e macchina spenta: dati finali del ', 'Build over and machine switched off: final data of ') : T('Il pod non è collegato: dati fermi al ', 'The build machine is not connected: data as of ')) + new Date(sys.t * 1000).toLocaleString(LOC, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }
  setInterval(() => { domain(); hud(); if (panel === 'build') renderPanel(); }, 5000);
  fetch('names.txt').then((r) => r.text()).then((t) => { names = t.split('\n'); if (panel) renderPanel(); }).catch(() => {});
}
requestAnimationFrame(frame);
boot();
})();
